# Alt8Mail threat intelligence.
#
# Confirmed security reports are published to these Redis hashes by the
# control plane. Rspamd reads the hashes directly, so adding or removing an
# indicator does not require editing this file or restarting Rspamd.
#
# Full URLs are never published; only normalized URL hostnames are stored in
# a8m_reported_urls. Shared destinations are excluded unless a reviewer
# explicitly opts in.

A8M_REPORTED_SENDER {
  type = "from";
  map = "redis://a8m_reported_senders";
  score = 15;
  description = "Sender confirmed by Alt8Mail security review";
}

A8M_REPORTED_SENDER_DOMAIN {
  type = "from";
  filter = "email:domain";
  map = "redis://a8m_reported_domains";
  score = 8;
  description = "Sender domain confirmed by Alt8Mail security review";
}

A8M_REPORTED_PHISHING_URL {
  type = "url";
  map = "redis://a8m_reported_urls";
  score = 8;
  description = "URL host confirmed by Alt8Mail security review";
}

# Domains hosted by this Alt8Mail instance. a8m-dkimprovision refreshes this
# map every minute from mail_domains. A message whose MIME From domain is on
# this list but did not pass aligned authentication is rejected; without this
# guard an attacker can send "From: admin@your-domain" through an unrelated
# sender domain and have it delivered to a local inbox.
A8M_LOCAL_FROM_DOMAIN {
  type = "header";
  header = "from";
  filter = "email:domain";
  map = "/var/lib/rspamd/local_domains.map";
  score = 0.0;
  description = "From domain is hosted by this Alt8Mail instance";
}

A8M_LOCAL_DOMAIN_SPOOF {
  type = "header";
  header = "from";
  filter = "email:domain";
  map = "/var/lib/rspamd/local_domains.map";
  require_symbols = "!DMARC_POLICY_ALLOW & (DMARC_POLICY_SOFTFAIL | DMARC_POLICY_REJECT | DMARC_POLICY_QUARANTINE | R_SPF_FAIL | R_SPF_SOFTFAIL | R_SPF_PERMFAIL | R_DKIM_REJECT | R_DKIM_PERMFAIL)";
  score = 100.0;
  description = "Local-domain sender failed SPF, DKIM and DMARC authentication";
}
