# Alt8Mail threat intelligence.
#
# Confirmed security reports are published to these Redis hashes by the
# control plane. Rspamd reads the hashes directly, so adding or removing an
# indicator does not require editing this file or restarting Rspamd.
#
# Full URLs are never published; only normalized URL hostnames are stored in
# a8m_reported_urls. Shared destinations are excluded unless a reviewer
# explicitly opts in.

A8M_REPORTED_SENDER {
  type = "from";
  map = "redis://a8m_reported_senders";
  score = 15;
  description = "Sender confirmed by Alt8Mail security review";
}

A8M_REPORTED_SENDER_DOMAIN {
  type = "from";
  filter = "email:domain";
  map = "redis://a8m_reported_domains";
  score = 8;
  description = "Sender domain confirmed by Alt8Mail security review";
}

A8M_REPORTED_PHISHING_URL {
  type = "url";
  map = "redis://a8m_reported_urls";
  score = 8;
  description = "URL host confirmed by Alt8Mail security review";
}
