# Alt8Mail local-domain guard.
#
# Authenticated submission and mail injected from this server's own networks
# must not be rejected by the hosted-domain anti-spoofing rule: SPF/DKIM are
# evaluated before Rspamd adds its outbound signature, so those messages can
# legitimately look unauthenticated at scan time.
a8m_authenticated_submission {
  authenticated = yes;
  apply {
    symbols_disabled = ["A8M_LOCAL_DOMAIN_SPOOF"];
  }
}

a8m_local_mail {
  local = yes;
  apply {
    symbols_disabled = ["A8M_LOCAL_DOMAIN_SPOOF"];
  }
}
