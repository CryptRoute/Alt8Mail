# Keep key-based break-glass root access; disable password and interactive auth.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
MaxAuthTries 3

# The System Control terminal authenticates to sshd over loopback. Allow
# password auth (including root) only for loopback peers; external SSH stays
# key-only. Keep this Match block last.
Match Address 127.0.0.1,::1
    PasswordAuthentication yes
    PermitRootLogin yes
    KbdInteractiveAuthentication no
Match all
