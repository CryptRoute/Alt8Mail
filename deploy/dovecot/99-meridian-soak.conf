# Append these settings to /etc/dovecot/conf.d/99-meridian.conf for a
# 1,000-mailbox single-host deployment. Hibernation keeps IDLE TCP/TLS sessions
# while releasing the per-connection IMAP process; imap-master must be reachable
# by the internal dovecot user or unhibernation fails.
imap_hibernate_timeout = 30s
default_client_limit = 3000
service imap-login {
  process_limit = 1200
}
service imap {
  process_limit = 1200
  extra_groups = $default_internal_group
  unix_listener imap-master {
    user = $default_internal_user
  }
}
service imap-hibernate {
  process_limit = 1
  client_limit = 3000
  unix_listener imap-hibernate {
    mode = 0660
    group = $default_internal_group
  }
}
