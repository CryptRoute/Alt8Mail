# Alt8Mail Dovecot site configuration.
mail_plugins = quota
protocols = imap pop3 lmtp sieve
listen = *, ::
mail_location = maildir:~/Maildir
mail_privileged_group = vmail
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000
auth_mechanisms = plain login
auth_username_format = %Lu
disable_plaintext_auth = yes
ssl = required
ssl_cert = </etc/dovecot/private/a8m-mail.crt
ssl_key = </etc/dovecot/private/a8m-mail.key
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
protocol lmtp {
  postmaster_address = postmaster@__DOMAIN__
  mail_plugins = $mail_plugins sieve
}
protocol imap {
  mail_plugins = $mail_plugins imap_quota
}
plugin {
  quota = maildir:User quota
  sieve = file:~/sieve;active=~/.dovecot.sieve
}
imap_hibernate_timeout = 30s
default_client_limit = 3000
service imap-login {
  process_limit = 1200
}
service imap {
  process_limit = 1200
  extra_groups = $default_internal_group
  unix_listener imap-master {
    user = $default_internal_user
  }
}
service imap-hibernate {
  process_limit = 1
  client_limit = 3000
  unix_listener imap-hibernate {
    mode = 0660
    group = $default_internal_group
  }
}
