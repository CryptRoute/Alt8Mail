name: i18n nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locale-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Locale certification report
        run: node scripts/i18n-certify.mjs
      - name: Locale payload budgets
        run: node scripts/i18n-perf.mjs --fail
      - name: Review packages
        run: node scripts/i18n-review.mjs --locale all
      - name: Enabled-locale screenshot matrix
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:i18n:matrix
      - name: Pseudo-locale and script checks
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:i18n:e2e
      - name: Upload locale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-locale-matrix
          path: |
            artifacts/i18n-matrix-*.png
            artifacts/i18n-pseudo-360.png
            artifacts/i18n-login-*.png
            artifacts/i18n-review/**
          if-no-files-found: warn
          retention-days: 14
      - name: Write certification to the job summary
        if: always()
        run: |
          {
            echo "## Locale certification"
            echo '```'
            node scripts/i18n-certify.mjs || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
